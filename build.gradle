 */
plugins {
    // Apply the java plugin to add support for Java
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.beryx.jlink' version '4.0.1'
}

repositories {

    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }

    modularity.inferModulePath = true
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
    useJUnitPlatform()
    def parserInputFile = System.getProperty('parser.inputFile')
    if (parserInputFile != null && !parserInputFile.isBlank()) {
        systemProperty 'parser.inputFile', parserInputFile
    }
    testLogging {
        showStandardStreams = true
    }
}

javadoc {
    options.addStringOption('Xdoclint:none', '-quiet')
    failOnError = false
}

javafx {
    version = "21"
    modules = ['javafx.controls', 'javafx.fxml']
}

application {
    mainModule = 'toadally.awesome.world'
    mainClass = 'Release.GuiMain'
}

jlink {
    options = ['--strip-debug', '--compress=2', '--no-header-files', '--no-man-pages']

    launcher {
        name = 'toadally-awesome-world'
    }

    jpackage {
        imageName = 'toadally-awesome-world'
        skipInstaller = true
    }
}
